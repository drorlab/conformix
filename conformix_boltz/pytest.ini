[pytest]
# Pytest configuration for ConforMix-Boltz

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that require model download and GPU
    slow: Tests that take a long time to run
    unit: Unit tests that are fast

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage (if pytest-cov is installed)
# addopts =
#     --cov=boltz
#     --cov-report=html
#     --cov-report=term-missing

